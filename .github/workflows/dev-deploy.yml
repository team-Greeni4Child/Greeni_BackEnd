name: Greeni Dev CI/CD

on:
  push:
    branches: ["develop"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'adopt'

      - name: application.yml
        run: echo "${{ secrets.APPLICATION_PROPERTIES }}" > ./src/main/resources/application-dev.yml

      - name: gradlew mod modify
        run: chmod +x gradlew

      - name: build with gradle
        run: ./gradlew clean build --exclude-task test

      - name: login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: build & push docker image
        run: |
          docker build --no-cache -t ${{ secrets.DOCKER_USERNAME }}/greeni:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/greeni:latest

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/greeni:latest
            sudo docker stop greeni || true
            sudo docker rm greeni || true
            sudo docker run -d --name greeni -p 8080:8080 \
              ${{ secrets.DOCKER_USERNAME }}/greeni:latest
            sudo docker image prune -f