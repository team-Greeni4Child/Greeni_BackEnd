name: Greeni Dev CI/CD

on:
  push:
    branches: ["develop"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'adopt'

      - name: application.yml
        run: echo "${{ secrets.APPLICATION_PROPERTIES }}" > ./src/main/resources/application-dev.yml

      - name: gradlew mod modify
        run: chmod +x gradlew

      - name: build with gradle
        run: ./gradlew clean build --exclude-task test

      - name: change build file
        run: mv ./build/libs/*SNAPSHOT.jar ./project.jar

      - name: deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: project.jar
          target: ~/Greeni_BackEnd/tobe

      - name: run on server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            rm -rf ~/Greeni_BackEnd/current
            mkdir ~/Greeni_BackEnd/current
            mv ~/Greeni_BackEnd/tobe/project.jar ~/Greeni_BackEnd/current/project.jar
            cd ~/Greeni_BackEnd/current
            sudo fuser -k -n tcp 8080 || true
            nohup java -jar project.jar > ./output.log 2>&1 &
            rm -rf ~/Greeni_BackEnd/tobe
